[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abcopt"
version = "0.2.2"
description = "Canonical Artificial Bee Colony (ABC) optimization with a scikit-learn compatible hyperparameter search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Korkmazyiğit", email = "yusuf.korkmazyigit@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scikit-learn>=1.0"]
keywords = ["artificial bee colony", "swarm intelligence", "metaheuristics",
            "hyperparameter optimization", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7", "pandas"]

[project.urls]
Homepage = "https://github.com/yusufkorkmazyigit/abc-optimizer-lib"
Issues = "https://github.com/yusufkorkmazyigit/abc-optimizer-lib/issues"

[tool.setuptools]
packages = ["abcopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
