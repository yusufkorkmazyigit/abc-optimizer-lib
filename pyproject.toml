[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-optimizer-lib"
version = "0.2.0"
description = "Canonical Artificial Bee Colony (ABC) optimization with a scikit-learn compatible hyperparameter search"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yusuf Korkmazyiğit", email = "yusuf.korkmazyigit@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scikit-learn>=1.0"]
keywords = ["artificial bee colony", "swarm intelligence", "metaheuristics",
            "hyperparameter optimization", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/yusufkorkmazyigit/abc-optimizer-lib"
Issues = "https://github.com/yusufkorkmazyigit/abc-optimizer-lib/issues"

[tool.setuptools]
packages = ["abc_algorithm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
